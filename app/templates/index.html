{% extends "base.html" %} {% block header %}
<h1>{{ title }}</h1>
{% endblock %} {% block content %}
<ul class="list-group">
  {% for book in books %}
  <li class="list-group-item">
    <h2>{{ book.title }}</h2>
    <p>{{ book.author }}</p>
    {% if book.imageUrl %}
    <img src="{{ book.imageUrl }}" />
    {% endif %}
  </li>
  {% endfor %}
</ul>
